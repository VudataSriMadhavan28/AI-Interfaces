<main>

    <div class="hero">

        <span class="tag">04</span>

        <h1>AI Command Bar</h1>

        <p>
            Use natural language commands to perform actions.
        </p>

    </div>

    <div class="row">

        <input
            id="commandInput"
            placeholder="Try: create a study plan"
        >

        <button onclick="runCommand()">
            Run
        </button>

    </div>

    <div class="card" id="commandResult">
        Waiting for a command...
    </div>

    <div class="chips">

        <button
            class="light"
            onclick="setCommand('Summarize my notes')">
            Summarize
        </button>

        <button
            class="light"
            onclick="setCommand('Create a study plan')">
            Study Plan
        </button>

        <button
            class="light"
            onclick="setCommand('Explain HTML')">
            Explain HTML
        </button>

    </div>

</main>

<footer>
    AI Interfaces Project | Member 1
</footer>

<script src="script.js"></script>

</body>
